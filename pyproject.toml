[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
license-files = ["LICENSE", "vendor/streamrip/LICENSE"]

[tool.setuptools.packages.find]
include = ["src", "src.*", "vendor.streamrip.streamrip", "vendor.streamrip.streamrip.*"]
exclude = ["tests", "tests.*"]

[project]
name = "music-downloader"
version = "0.1.0"
description = "A Python CLI and GUI for downloading music from Deezer using search queries or Spotify metadata"
readme = "README.md"
requires-python = "<4.0,>=3.10"
license = "MIT AND GPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"*" = ["*.toml", "*.json"]

[project.scripts]
music-downloader = "src.downloader:main"
mdl = "src.downloader:main"
mdl-gui = "src.downloader:main_gui"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
extend-exclude = ["vendor"]
