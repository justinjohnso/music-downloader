# mdl-config-example.toml
# This is the mdl overlay config. It only contains settings that mdl itself uses.
# All other settings (qobuz, tidal, artwork, filepaths, etc.) are handled by streamrip.
# Run `rip config open` or edit streamrip's config.toml directly for those.

[mdl]
# Folder where tracks are downloaded to. Overrides streamrip's default.
download_folder = "~/Music/Music Downloader"
# Quality: "mp3" (320kbps) or "flac" (lossless). Used by setup wizard.
quality = "mp3"

[spotify]
# Pre-configured — only set these if you want to override the built-in credentials
# client_id = ""
# client_secret = ""

[deezer]
# Required: your Deezer ARL cookie.
# Get it at: https://github.com/nathom/streamrip/wiki/Finding-Your-Deezer-ARL-Cookie
# Deezer ARLs expire every 3–4 months.
arl = ""
