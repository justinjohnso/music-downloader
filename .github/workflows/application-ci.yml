name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.10
      - run: ruff check .
      - run: ruff format --check .

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/mdl-wheels"
          python -m pip install "$RUNNER_TEMP"/mdl-wheels/*.whl
          python -m pip check
      - name: Application regressions
        run: python -m pytest -ra
      - name: Installed entrypoints
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          mdl --help
          music-downloader --help
          python "$GITHUB_WORKSPACE/scripts/smoke-installed.py"
